<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>setu dashboard</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <nav class="side" aria-label="Sections">
    <div class="brand">
      <img src="/icon.svg" alt="" width="26" height="26">
      <span class="brand-name">setu</span>
      <span class="pill mono" id="version"></span>
    </div>
    <ul class="nav">
      <li><a href="#/overview" data-page="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Overview</a></li>
      <li><a href="#/sessions" data-page="sessions"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 9l3 2.5L7 14M12 14h5"/></svg>Live sessions<span class="pill count" id="live-count" hidden></span></a></li>
      <li><a href="#/profiles" data-page="profiles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v5c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V7z"/></svg>Profiles and devices</a></li>
      <li><a href="#/activity" data-page="activity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</a></li>
    </ul>
    <div class="side-foot">
      <div class="note">
        <p class="note-title">Local only</p>
        <p>Served by <span class="mono">setu dashboard</span> on this computer. It shows no links or keys. Stop it with Ctrl-C in its terminal.</p>
      </div>
      <div class="side-actions">
        <button type="button" class="btn btn-quiet" id="theme" aria-label="Switch colour theme">Theme: auto</button>
        <button type="button" class="btn btn-quiet" id="signout">Sign out</button>
      </div>
    </div>
  </nav>
  <main id="main" tabindex="-1">
    <div id="banner" role="alert" hidden></div>
    <div id="view" aria-live="off"></div>
  </main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<noscript><p class="noscript">The setu dashboard needs JavaScript.</p></noscript>
</body>
</html>
