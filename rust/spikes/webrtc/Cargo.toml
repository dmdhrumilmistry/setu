[package]
name = "webrtc-spike"
version = "0.1.0"
edition = "2024"
autobins = true

# Throwaway spike for the Rust migration (docs/rust-migration.md, Phase 0):
# one binary per WebRTC stack, run against rust/spikes/webrtc/gopeer.

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde_json = "1"
str0m = { version = "0.26", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1", features = ["full"] }
webrtc = "0.21"
