name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - name: build
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/setu-${GITHUB_REF_NAME}-${os}-${arch}${ext}" ./cmd/setu
          done
          cd dist && sha256sum * > SHA256SUMS
      - name: sign SHA256SUMS (setu upgrade verifies it when the build has the release key)
        env:
          SETU_RELEASE_SIGNING_KEY: ${{ secrets.SETU_RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "$SETU_RELEASE_SIGNING_KEY" ]; then
            go run ./tools/releasesign sign dist/SHA256SUMS
          elif grep -q '^var ReleaseKeys = \[\]string{}' internal/update/update.go; then
            echo "::warning::no SETU_RELEASE_SIGNING_KEY secret: this release is unsigned"
          else
            echo "::error::builds verify release signatures, but SETU_RELEASE_SIGNING_KEY is not set"; exit 1
          fi
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
