name: pages

# Publishes web/ (the static browser client) to GitHub Pages.
# Repo settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: verify vendored files
        run: cd web/vendor && sha256sum -c SHA256SUMS
      - name: assemble site
        run: |
          mkdir -p _site
          cp -r web/index.html web/style.css web/js web/vendor _site/
          rm -f _site/vendor/update.sh
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
