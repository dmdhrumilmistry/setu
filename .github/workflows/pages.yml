name: pages

# Publishes web/ (the static browser client) and docs/ (the documentation
# site, at /docs/) to GitHub Pages. When Pages instead deploys the main
# branch, the root index.html forwards to web/ and docs/ is served as is.
# Repo settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: verify vendored files
        run: cd web/vendor && sha256sum -c SHA256SUMS
      - name: assemble site
        run: |
          mkdir -p _site
          cp -r web/index.html web/style.css web/js web/vendor _site/
          rm -f _site/vendor/update.sh
          # Documentation site (generated by tools/docsgen, committed).
          mkdir -p _site/docs
          cp -r docs/*.html docs/search-index.json docs/assets _site/docs/
          # One-line installers: curl -fsSL <site>/install.sh | sh
          cp install.sh install.ps1 _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
