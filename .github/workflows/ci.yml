name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  # Checks that do not need the tests, in parallel with them.
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: cross-compile
        run: |
          pids=()
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/setu & pids+=($!)
          done
          for p in "${pids[@]}"; do wait "$p"; done
      - name: CLI smoke test (background share + join over public relays)
        run: go build -o bin/ ./cmd/setu && scripts/smoke.sh ./bin/setu
      - name: desktop backend on a real X11 server (Xvfb)
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1280x800x24" env SETU_DESKTOP_INPUT_TEST=1 go test -count=1 -run TestRealScreen -v ./internal/desktop/

  # Real PTY/ConPTY + WebRTC e2e tests on the other host platforms, and the
  # remote desktop backend on several macOS versions (input is injected on
  # the macOS runners, which allow posting events).
  go-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 -v ./...
        env:
          SETU_DESKTOP_INPUT_TEST: ${{ startsWith(matrix.os, 'macos') && '1' || '' }}
      - run: go build -o bin/ ./cmd/setu
      - name: CLI smoke test (background share + join over public relays)
        shell: bash
        run: scripts/smoke.sh ./bin/setu

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: docs are generated, links resolve, every CLI flag is documented
        run: cd tools/docsgen && go vet . && go run . -check
      - name: docs scripts parse
        run: for f in docs/assets/*.js; do node --check "$f"; done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: crypto parity with Go
        run: node --test web/test/crypto.test.mjs
      - name: key mapping between Mac and PC keyboards
        run: node --test web/test/keymap.test.mjs
      - name: vendored files untouched
        run: cd web/vendor && sha256sum -c SHA256SUMS

  # The browser jobs start at once instead of waiting for the Go jobs: they
  # are the longest, and a Go failure fails the run anyway.
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}-chromium
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: go build -o setu ./cmd/setu
      - name: browser -> web client -> local relay -> setu share
        run: SETU_LOCAL_RELAY=1 node web/test/browser-e2e.mjs
      - name: browser -> web client -> local relay -> setu desktop (Xvfb)
        run: |
          sudo apt-get install -y xvfb x11-apps xclip
          # Xvfb starts solid black, which the test rightly calls blank: put a window on it (away from the centre the test clicks).
          xvfb-run -a -s "-screen 0 1280x800x24" sh -c 'xclock -geometry 400x400+0+0 & sleep 1; SETU_LOCAL_RELAY=1 SETU_DESKTOP_INPUT_TEST=1 node web/test/desktop-e2e.mjs'

  # A real browser controlling `setu desktop` on a real Mac (public relays:
  # Go on macOS verifies TLS with the system, so the local test relay's
  # self-signed certificate cannot be trusted there).
  desktop-e2e-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}-chromium
      - run: npm i --no-save playwright@1.63.0 && npx playwright install chromium
      - run: go build -o setu ./cmd/setu
      - name: browser -> web client -> public relays -> setu desktop on macOS
        run: SETU_DESKTOP_INPUT_TEST=1 node web/test/desktop-e2e.mjs
