name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test -race -count=1 ./...
      - name: CLI smoke test (background share + join over public relays)
        run: go build -o bin/ ./cmd/setu && scripts/smoke.sh ./bin/setu
      - name: cross-compile
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/setu
          done

  # Real PTY/ConPTY + WebRTC e2e tests on the other host platforms.
  go-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 -v ./...
      - run: go build -o bin/ ./cmd/setu
      - name: CLI smoke test (background share + join over public relays)
        shell: bash
        run: scripts/smoke.sh ./bin/setu

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: crypto parity with Go
        run: node --test web/test/crypto.test.mjs
      - name: vendored files untouched
        run: cd web/vendor && sha256sum -c SHA256SUMS

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [go, go-os, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: go build -o setu ./cmd/setu
      - name: browser -> web client -> local relay -> setu share
        run: SETU_LOCAL_RELAY=1 node web/test/browser-e2e.mjs
